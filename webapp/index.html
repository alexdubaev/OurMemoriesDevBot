<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F5" />
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script>
      (() => {
        const webApp = window.WebApp
        const meaningfulMax = webApp !== null
          && typeof webApp === 'object'
          && !Array.isArray(webApp)
          && typeof webApp.initData === 'string'
          && webApp.initData.trim().length > 0
          && (typeof webApp.ready === 'function'
            || typeof webApp.close === 'function'
            || typeof webApp.version === 'string'
            || typeof webApp.platform === 'string'
            || typeof webApp.colorScheme === 'string')

        if (!meaningfulMax) {
          document.write('<script src="https://telegram.org/js/telegram-web-app.js?63"><\/script>')
        }
      })()
    </script>
    <title>memoLy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
