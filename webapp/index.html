<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F5" />
    <script>
      (() => {
        const hostKinds = ['max', 'telegram', 'browser', 'unknown']
        const errorNames = ['Error', 'EvalError', 'RangeError', 'ReferenceError', 'SyntaxError', 'TypeError', 'URIError']
        const errorStages = ['index-inline', 'main-bootstrap']
        const allowedHostDetectedPaths = new Set(hostKinds.flatMap((hostKind) => [false, true].flatMap((webAppExists) => [false, true].map((initDataPresent) =>
          `/__diag/host-detected/${hostKind}/webapp-${String(webAppExists)}/initdata-${String(initDataPresent)}`,
        ))))
        const allowedUncaughtErrorPaths = new Set(errorNames.flatMap((errorName) => errorStages.map((stage) => `/__diag/uncaught-error/${errorName}/${stage}`)))
        const allowedPaths = new Set([
          '/__diag/index-inline-start',
          '/__diag/main-module-evaluated',
          '/__diag/auth-started',
          ...allowedHostDetectedPaths,
          ...allowedUncaughtErrorPaths,
        ])
        let errorStage = 'index-inline'

        const emit = (path) => {
          if (typeof path !== 'string' || !allowedPaths.has(path)) return false
          try {
            void window.fetch(path, {
              method: 'POST',
              credentials: 'omit',
              keepalive: true,
              body: null,
              referrerPolicy: 'no-referrer',
            }).catch(() => undefined)
          } catch {
            // Diagnostics must never affect application bootstrap.
          }
          return true
        }
        const markUncaughtError = (errorName, stage) => {
          if (!errorNames.includes(errorName) || !errorStages.includes(stage)) return false
          const path = `/__diag/uncaught-error/${errorName}/${stage}`
          return allowedUncaughtErrorPaths.has(path) && emit(path)
        }

        window.__memoLyBootstrapDiagnostic = {
          emit,
          markIndexInlineStart: () => emit('/__diag/index-inline-start'),
          markMainModuleEvaluated: () => {
            errorStage = 'main-bootstrap'
            return emit('/__diag/main-module-evaluated')
          },
          markHostDetected: (hostKind, webAppExists, initDataPresent) => {
            if (!hostKinds.includes(hostKind) || typeof webAppExists !== 'boolean' || typeof initDataPresent !== 'boolean') return false
            const path = `/__diag/host-detected/${hostKind}/webapp-${String(webAppExists)}/initdata-${String(initDataPresent)}`
            return allowedHostDetectedPaths.has(path) && emit(path)
          },
          markAuthStarted: () => emit('/__diag/auth-started'),
          markUncaughtError,
        }
        window.addEventListener('error', (event) => {
          const errorName = typeof event.error?.name === 'string' && errorNames.includes(event.error.name) ? event.error.name : 'Error'
          markUncaughtError(errorName, errorStage)
        })
        window.addEventListener('unhandledrejection', () => {
          markUncaughtError('Error', errorStage)
        })
        emit('/__diag/index-inline-start')
      })()
    </script>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <title>memoLy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
