<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/webp" sizes="192x192" href="/assets/brand/pwa-memoly-192.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F5" />
    <meta name="application-name" content="memoLy" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      (() => {
        const maxSdk = 'https://st.max.ru/js/max-web-app.js'
        const telegramSdk = 'https://telegram.org/js/telegram-web-app.js?63'
        const maxMarkers = ['WebAppData', 'WebAppPlatform', 'WebAppVersion']
        const telegramMarkers = ['tgWebAppData', 'tgWebAppPlatform', 'tgWebAppVersion']

        const hasFragmentMarker = (markers) => {
          const hash = typeof window.location?.hash === 'string' ? window.location.hash : ''
          return markers.some((marker) => new RegExp(`(?:^|[#&])${marker}=`).test(hash))
        }

        const hasPersistedMarker = (markers, serializedKey = null) => {
          try {
            const storage = window.sessionStorage
            if (serializedKey) {
              const serialized = storage.getItem(serializedKey)
              if (serialized === null) return false
              const persisted = JSON.parse(serialized)
              return persisted !== null
                && typeof persisted === 'object'
                && !Array.isArray(persisted)
                && markers.some((marker) => Object.prototype.hasOwnProperty.call(persisted, marker))
            }
            return markers.some((marker) => storage.getItem(marker) !== null)
          } catch {
            return false
          }
        }

        const webApp = window.WebApp
        const meaningfulMax = webApp !== null
          && typeof webApp === 'object'
          && !Array.isArray(webApp)
          && typeof webApp.initData === 'string'
          && webApp.initData.trim().length > 0
          && (typeof webApp.ready === 'function'
            || typeof webApp.close === 'function'
            || typeof webApp.version === 'string'
            || typeof webApp.platform === 'string'
            || typeof webApp.colorScheme === 'string')

        const telegramWebApp = window.Telegram?.WebApp
        const meaningfulTelegram = telegramWebApp !== null
          && typeof telegramWebApp === 'object'
          && !Array.isArray(telegramWebApp)
          && typeof telegramWebApp.initData === 'string'
          && telegramWebApp.initData.trim().length > 0

        const maxLaunch = hasFragmentMarker(maxMarkers) || hasPersistedMarker(maxMarkers)
        const telegramLaunch = hasFragmentMarker(telegramMarkers)
          || hasPersistedMarker(telegramMarkers, '__telegram__initParams')
        const sdk = maxLaunch || meaningfulMax
          ? maxSdk
          : telegramLaunch || meaningfulTelegram
            ? telegramSdk
            : null

        if (sdk) document.write(`<script src="${sdk}"><\/script>`)
      })()
    </script>
    <title>memoLy</title>
  </head>
  <body>
    <div id="root">
      <p role="status" aria-live="polite" style="margin: 0; min-height: 100vh; padding: 24px; box-sizing: border-box; color: #1f1f1f; background: #fff; font: 16px/1.5 system-ui, sans-serif;">
        Загрузка memoLy…
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
