<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="only light" />
    <!-- memoly-diagnostics-bootstrap -->
    <script>
      (() => {
        let mounted = false
        let failed = false
        let mountTimer
        let rootObserver
        const showFailure = (category = 'startup-failed') => {
          if (failed && document.getElementById('root')?.dataset.startupFailed === 'true') return
          failed = true
          window.__MEMOLY_DIAGNOSTICS__?.record(category, 'startup')
          window.clearTimeout(mountTimer)
          const target = document.getElementById('root')
          if (!target) {
            rootObserver ??= new MutationObserver(() => {
              if (!document.getElementById('root')) return
              rootObserver?.disconnect()
              rootObserver = undefined
              showFailure()
            })
            rootObserver.observe(document.documentElement, { childList: true, subtree: true })
            return
          }
          target.dataset.startupFailed = 'true'
          const main = document.createElement('main')
          main.setAttribute('role', 'alert')
          main.style.cssText = 'min-height:100vh;box-sizing:border-box;padding:24px;display:grid;place-content:center;gap:16px;text-align:center;background:#fff;color:#1f1f1f;font:16px/1.5 system-ui,sans-serif'
          const message = document.createElement('p')
          message.textContent = 'Не удалось открыть приложение. Проверьте соединение и попробуйте ещё раз.'
          const retry = document.createElement('button')
          retry.type = 'button'
          retry.textContent = 'Повторить'
          retry.style.cssText = 'min-height:48px;padding:0 20px;border:0;border-radius:14px;background:#efc9c0;color:#1f1f1f;font:inherit;font-weight:600'
          retry.addEventListener('click', () => window.location.reload())
          const copy = document.createElement('button')
          copy.type = 'button'
          copy.textContent = 'Скопировать отчёт об ошибке'
          copy.style.cssText = retry.style.cssText
          copy.addEventListener('click', async () => {
            const report = window.__MEMOLY_DIAGNOSTICS__?.report() ?? '{"error":"report-unavailable"}'
            try {
              if (!navigator.clipboard?.writeText) throw new Error('clipboard unavailable')
              await navigator.clipboard.writeText(report)
              copy.textContent = 'Отчёт скопирован'
              fallback.hidden = true
            } catch {
              fallback.value = report
              fallback.hidden = false
              fallback.focus()
              fallback.select()
            }
          })
          const fallback = document.createElement('textarea')
          fallback.setAttribute('aria-label', 'Отчёт об ошибке для ручного копирования')
          fallback.readOnly = true
          fallback.hidden = true
          fallback.style.cssText = 'width:100%;min-height:120px;box-sizing:border-box;font:12px/1.4 monospace'
          main.append(message, retry, copy, fallback)
          target.replaceChildren(main)
        }
        mountTimer = window.setTimeout(() => {
          console.error('[memoLy] startup_mount_timeout')
          showFailure('startup-timeout')
        }, 20000)
        const api = {
          fail: showFailure,
          canMount: () => !failed,
          mounted: () => { mounted = true; window.clearTimeout(mountTimer); rootObserver?.disconnect(); window.__MEMOLY_DIAGNOSTICS__?.record('mounted', 'mounted') },
        }
        window.__MEMOLY_STARTUP__ = api
        window.addEventListener('error', (event) => {
          if (!mounted && (event.target instanceof HTMLScriptElement || event instanceof ErrorEvent)) {
            const category = event.target instanceof HTMLScriptElement ? 'startup-asset-failed' : 'startup-runtime-failed'
            console.error(event.target instanceof HTMLScriptElement ? '[memoLy] startup_asset_failed' : '[memoLy] startup_runtime_failed')
            showFailure(category)
          }
        }, true)
        window.addEventListener('unhandledrejection', () => {
          if (mounted) return
          console.error('[memoLy] startup_unhandled_rejection')
          showFailure('startup-unhandled-rejection')
        })
        const hasMarker = (value, markers) => typeof value === 'string'
          && markers.some((marker) => new RegExp(`(?:^|[#&])${marker}=[^&#]+`).test(value))
        const isMeaningful = (app, max) => app && typeof app === 'object' && !Array.isArray(app)
          && typeof app.initData === 'string' && app.initData.trim().length > 0
          && (!max || typeof app.ready === 'function' || typeof app.close === 'function' || typeof app.version === 'string' || typeof app.platform === 'string' || typeof app.colorScheme === 'string')
        let navigationHash = ''
        try {
          const navigation = window.performance?.getEntriesByType?.('navigation')?.[0]?.name
          if (typeof navigation === 'string') {
            const hashStart = navigation.indexOf('#')
            navigationHash = hashStart >= 0 ? navigation.slice(hashStart) : ''
          }
        } catch { /* navigation timing is optional */ }
        const currentHash = window.location.hash
        const maxMarkers = ['WebAppData', 'WebAppPlatform', 'WebAppVersion']
        const telegramMarkers = ['tgWebAppData', 'tgWebAppPlatform', 'tgWebAppVersion']
        const currentMax = hasMarker(currentHash, maxMarkers)
        const currentTelegram = hasMarker(currentHash, telegramMarkers)
        const navigationMax = hasMarker(navigationHash, maxMarkers)
        const navigationTelegram = hasMarker(navigationHash, telegramMarkers)
        const maxApp = window.WebApp
        const telegramApp = window.Telegram?.WebApp
        const meaningfulMax = isMeaningful(maxApp, true)
        const meaningfulTelegram = isMeaningful(telegramApp, false)
        const host = currentMax ? 'max' : currentTelegram ? 'telegram'
          : meaningfulMax ? 'max' : meaningfulTelegram ? 'telegram'
            : navigationMax ? 'max' : navigationTelegram ? 'telegram' : null
        const sdkUrl = host === 'max' && !meaningfulMax ? 'https://st.max.ru/js/max-web-app.js'
          : host === 'telegram' && !meaningfulTelegram ? 'https://telegram.org/js/telegram-web-app.js?63' : null
        api.hostReady = !sdkUrl ? Promise.resolve(true) : new Promise((resolve) => {
          let settled = false
          let timer
          const finish = (ready) => {
            if (settled) return
            settled = true
            window.clearTimeout(timer)
            if (!ready) {
              console.error('[memoLy] host_sdk_unavailable')
              showFailure('host-sdk-unavailable')
            }
            resolve(ready)
          }
          timer = window.setTimeout(() => finish(false), 10000)
          const script = document.createElement('script')
          script.async = true
          script.src = sdkUrl
          script.onload = () => finish(host === 'max' ? isMeaningful(window.WebApp, true) : isMeaningful(window.Telegram?.WebApp, false))
          script.onerror = () => finish(false)
          document.head.append(script)
        })
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/webp" sizes="192x192" href="/assets/brand/pwa-memoly-192.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F5" />
    <meta name="application-name" content="memoLy" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>memoLy</title>
  </head>
  <body>
    <div id="root">
      <p role="status" aria-live="polite" style="margin: 0; min-height: 100vh; padding: 24px; box-sizing: border-box; color: #1f1f1f; background: #fff; font: 16px/1.5 system-ui, sans-serif;">
        Загрузка memoLy…
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
