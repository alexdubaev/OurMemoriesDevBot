<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head>
<body>
<div id="root"></div>
<script type="module">
  import React from 'react'
  import { createRoot } from 'react-dom/client'
  import '/src/production.css'
  import { WelcomeSplash } from '/src/features/welcome/WelcomeSplash.tsx'
  createRoot(document.getElementById('root')).render(React.createElement(WelcomeSplash, { onComplete() { document.documentElement.dataset.welcomeComplete = String((Number(document.documentElement.dataset.welcomeComplete) || 0) + 1) } }))
</script>
</body>
</html>
