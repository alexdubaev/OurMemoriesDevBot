name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-required:
    name: verify-required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install FFmpeg runtime for media integration tests
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - run: bun install --frozen-lockfile
      - id: plan
        name: Select the pull-request impact plan or full release plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMRD -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            bun scripts/verify-plan.mjs --stdin0 < "$RUNNER_TEMP/changed-paths"
          else
            bun scripts/verify-plan.mjs --full
          fi
      - name: Architecture checks
        if: contains(steps.plan.outputs.command_ids, 'architecture')
        run: bun run architecture:check
      - name: Template checks
        if: contains(steps.plan.outputs.command_ids, 'template')
        run: bun run template:check
      - name: Type checks
        if: contains(steps.plan.outputs.command_ids, 'typecheck')
        run: bun run typecheck
      - name: Contract tests
        if: contains(steps.plan.outputs.command_ids, 'contracts')
        run: bun run test:contracts
      - name: Backend unit tests
        if: contains(steps.plan.outputs.command_ids, 'backend-unit')
        run: bun run test:backend:unit
      - name: Backend integration tests
        if: contains(steps.plan.outputs.command_ids, 'backend-integration')
        run: bun run test:backend:integration
      - name: Webapp tests
        if: contains(steps.plan.outputs.command_ids, 'webapp')
        run: bun run test:webapp
      - name: Website tests
        if: contains(steps.plan.outputs.command_ids, 'website-tests')
        run: bun run test:website
      - name: Webapp build
        if: contains(steps.plan.outputs.command_ids, 'build-webapp')
        run: bun run build:webapp
      - name: Build artifact contract checks
        if: contains(steps.plan.outputs.command_ids, 'build-contracts')
        run: bun run test:build-contracts
      - name: Infrastructure tests
        if: contains(steps.plan.outputs.command_ids, 'infra-tests')
        run: bun run test:infra
      - name: Dependency audit
        if: contains(steps.plan.outputs.command_ids, 'audit')
        run: bun run audit
      - name: Verification tooling tests
        if: contains(steps.plan.outputs.command_ids, 'verification-tools')
        run: bun run test:verification-tools
      - name: Lint
        if: contains(steps.plan.outputs.command_ids, 'lint')
        run: bun run lint
      - name: Install Playwright browsers and system dependencies
        if: contains(steps.plan.outputs.command_ids, 'e2e-release')
        run: bunx playwright install --with-deps chromium webkit
      - name: Release E2E profile
        if: contains(steps.plan.outputs.command_ids, 'e2e-release')
        run: bun run e2e:webapp:release
      - name: Local S3 storage integration tests
        if: contains(steps.plan.outputs.command_ids, 'storage-s3')
        run: bun run test:storage:s3
      - name: Backend Docker runtime smoke
        if: contains(steps.plan.outputs.command_ids, 'docker-smoke')
        run: bun run smoke:backend:docker
