name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation checks
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.4.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: bun install --frozen-lockfile
      - run: bun run architecture:check
      - run: bun run typecheck
      - run: bun test tests/verify-plan.test.ts
      - run: bun run build:webapp

  verify-required:
    name: verify-required
    if: always()
    needs: [foundation]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless every required check succeeded
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
        run: test "$FOUNDATION_RESULT" = success
