name: Selectel production release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact 40-character SHA currently accepted on main'
        required: true
        type: string
      deploy_confirmation:
        description: 'Type DEPLOY to allow production promotion'
        required: true
        type: string
      run_migration:
        description: 'Run the guarded database migration before promotion'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: selectel-production
  cancel-in-progress: false

jobs:
  release:
    name: Build and deploy Selectel release
    runs-on: ubuntu-latest
    environment:
      name: selectel-production
    env:
      SELECTEL_HOST: ${{ vars.SELECTEL_HOST }}
      SELECTEL_SSH_USER: ${{ vars.SELECTEL_SSH_USER }}
      SELECTEL_MAX_BOT_USERNAME: ${{ vars.SELECTEL_MAX_BOT_USERNAME }}
    steps:
      - name: Require main branch dispatch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Selectel production releases may only be dispatched from main.' >&2
          exit 1

      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Validate release input and accepted main SHA
        id: release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DEPLOY_CONFIRMATION: ${{ inputs.deploy_confirmation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a 40-character lowercase SHA' >&2; exit 1; }
          [ "$DEPLOY_CONFIRMATION" = DEPLOY ] || { echo 'deploy_confirmation must be exactly DEPLOY' >&2; exit 1; }
          git fetch --prune origin main
          accepted_sha="$(git rev-parse refs/remotes/origin/main)"
          [ "$RELEASE_SHA" = "$accepted_sha" ] || { echo 'release_sha must equal the current origin/main SHA' >&2; exit 1; }
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -s deploy/selectel/ci-release.sh

      - name: Check required protected environment configuration
        env:
          DEPLOY_KEY: ${{ secrets.SELECTEL_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SELECTEL_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "$SELECTEL_HOST" ] || { echo 'selectel-production variable SELECTEL_HOST is missing' >&2; exit 1; }
          [ -n "$SELECTEL_SSH_USER" ] || { echo 'selectel-production variable SELECTEL_SSH_USER is missing' >&2; exit 1; }
          [ -n "$SELECTEL_MAX_BOT_USERNAME" ] || { echo 'selectel-production variable SELECTEL_MAX_BOT_USERNAME is missing' >&2; exit 1; }
          [[ "$SELECTEL_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'SELECTEL_HOST has an invalid hostname format' >&2; exit 1; }
          [[ "$SELECTEL_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]] || { echo 'SELECTEL_SSH_USER has an invalid username format' >&2; exit 1; }
          [[ "$SELECTEL_MAX_BOT_USERNAME" =~ ^[A-Za-z0-9_]{5,32}$ ]] || { echo 'SELECTEL_MAX_BOT_USERNAME has an invalid public username format' >&2; exit 1; }
          [ -n "$DEPLOY_KEY" ] || { echo 'selectel-production secret SELECTEL_DEPLOY_SSH_PRIVATE_KEY is missing' >&2; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo 'selectel-production secret SELECTEL_KNOWN_HOSTS is missing' >&2; exit 1; }

      - name: Run reviewed host release entry point
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DEPLOY_CONFIRMATION: ${{ inputs.deploy_confirmation }}
          RUN_MIGRATION: ${{ inputs.run_migration }}
          DEPLOY_KEY: ${{ secrets.SELECTEL_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SELECTEL_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          cleanup() { rm -f -- "$key_file" "$known_hosts_file"; }
          trap cleanup EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh \
            -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o ConnectTimeout=15 \
            "$SELECTEL_SSH_USER@$SELECTEL_HOST" \
            bash -s -- "$RELEASE_SHA" "$DEPLOY_CONFIRMATION" "$RUN_MIGRATION" "$SELECTEL_MAX_BOT_USERNAME" \
            < deploy/selectel/ci-release.sh
